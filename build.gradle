plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

def localFliteLibraryPath = "${System.getProperty('user.home')}/.local/opt/flite/lib"
def inheritedLibraryPath = System.getenv('LD_LIBRARY_PATH')
def developmentLibraryPath = inheritedLibraryPath
        ? "${localFliteLibraryPath}:${inheritedLibraryPath}"
        : localFliteLibraryPath

repositories {
    mavenCentral()
    maven {
        name = 'LDT Team'
        url = 'https://ldtteam.jfrog.io/artifactory/modding/'
        content {
            includeGroup 'com.ldtteam'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            environment 'LD_LIBRARY_PATH', developmentLibraryPath

            // Hybrid Intel/NVIDIA laptops need PRIME offload flags for Minecraft to render on the dGPU.
            environment 'DRI_PRIME', '1'
            environment '__NV_PRIME_RENDER_OFFLOAD', '1'
            environment '__GLX_VENDOR_LIBRARY_NAME', 'nvidia'
            environment '__VK_LAYER_NV_optimus', 'NVIDIA_only'
        }

        quickClient {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            environment 'LD_LIBRARY_PATH', developmentLibraryPath
            programArgument '--quickPlaySingleplayer'
            programArgument 'RTCOLONY'

            // Hybrid Intel/NVIDIA laptops need PRIME offload flags for Minecraft to render on the dGPU.
            environment 'DRI_PRIME', '1'
            environment '__NV_PRIME_RENDER_OFFLOAD', '1'
            environment '__GLX_VENDOR_LIBRARY_NAME', 'nvidia'
            environment '__VK_LAYER_NV_optimus', 'NVIDIA_only'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly("com.ldtteam:minecolonies:${minecolonies_version}") {
        transitive = false
    }
    compileOnly("com.ldtteam:structurize:${structurize_version}") {
        transitive = false
    }
    compileOnly("com.ldtteam:blockui:${blockui_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:jade:${jade_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:sodium:${sodium_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:XeEZ3fK2:${freecam_version_id}") {
        transitive = false
    }

    localRuntime("com.ldtteam:minecolonies:${minecolonies_version}") {
        exclude group: 'mezz.jei'
    }
    localRuntime("com.ldtteam:structurize:${structurize_version}") {
        exclude group: 'mezz.jei'
    }
    localRuntime("maven.modrinth:jade:${jade_version}") {
        transitive = false
    }
    localRuntime("maven.modrinth:sodium:${sodium_version}") {
        transitive = false
    }
    localRuntime("maven.modrinth:XeEZ3fK2:${freecam_version_id}") {
        transitive = false
    }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.ow2.asm:asm:${asm_version}"
    testRuntimeOnly("maven.modrinth:sodium:${sodium_version}") {
        transitive = false
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecolonies_version_range: minecolonies_version_range,
            structurize_version_range : structurize_version_range,
            jade_version_range        : jade_version_range,
            sodium_version_range      : sodium_version_range,
            freecam_version_range     : freecam_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri(layout.projectDirectory.dir('repo'))
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
